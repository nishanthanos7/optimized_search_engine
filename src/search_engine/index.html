                <button type="button" id="clearBtn" class="clear-btn" hidden aria-label="Clear search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6 6 18"/>
                    </svg>
                </button>
                <button type="submit" class="submit-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/>
                        <path d="m13 6 6 6-6 6"/>
                    </svg>
                </button>
            </form>
            <div id="suggestions" class="suggestions" role="listbox" aria-label="Search suggestions"></div>
        </div>

        <p class="home-hint">
            Press <kbd>/</kbd> to focus
            <span class="dot" aria-hidden="true">·</span>
            Searches DuckDuckGo, Bing &amp; Wikipedia
        </p>
    </header>

    <!-- Results -->
    <main class="main-content">
        <div id="resultsMeta" class="results-meta" aria-live="polite"></div>

        <!-- AI Mode answer panel -->
        <section id="aiModePanel" class="ai-mode-panel collapsed" aria-label="AI Mode answer">
            <div class="ai-mode-card border-animate">
                <div class="ai-mode-header" onclick="AiMode.toggleCollapse()" role="button" tabindex="0" aria-label="Toggle AI Mode answer">
                    <span class="ai-mode-badge">AI Mode</span>
                    <span id="aiModeQuery" class="ai-mode-query"></span>
                    <span id="aiModeToggleText" class="ai-mode-toggle">Show answer</span>
                    <span class="ai-mode-chip" id="aiModeSourcesToggle" onclick="AiMode.toggleSources(event)" title="View sources table">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="3"/>
                        </svg>
                        Table
                    </span>
                </div>
                <div id="aiModeThinking" class="ai-mode-thinking" style="display:none;">
                    <span class="thinking-label">Thinking</span>
                    <div class="thinking-ring">
                        <div class="thinking-marquee" id="thinkingMarquee"></div>
                    </div>
                </div>
                <div id="aiModeAnswer" class="ai-mode-answer"></div>
                <div id="aiModeAnswerBar" class="ai-mode-answer-bar hidden">
                    <button id="aiModeAnswerToggle" class="ai-mode-answer-toggle" onclick="AiMode.toggleAnswerExpand()">
                        Show more <svg class="ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>
                    </button>
                </div>
                <div id="aiModeSources" class="ai-mode-sources"></div>
                <div id="aiModeError" class="ai-mode-error"></div>
            </div>
        </section>

        <!-- Results + Knowledge Panel Layout -->
        <div class="results-grid">
            <div class="results-column">
                <div id="resultsContainer" class="results"></div>
                <div id="paginationContainer"></div>
            </div>

            <!-- Wikipedia Knowledge Panel (Right Column) -->
            <section id="knowledgePanel" class="knowledge-panel hidden" aria-label="Knowledge panel">
                <div class="knowledge-card border-animate">
                    <div class="knowledge-header flex items-start gap-4 px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
                        <div class="flex-shrink-0">
                            <img id="knowledgeImage" class="w-32 h-32 rounded-full border-4 border-slate-200 dark:border-slate-700 shadow-md object-cover" src="" alt="" style="display:none;">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h2 id="knowledgeTitle" class="text-xl font-bold text-slate-900 dark:text-slate-100 leading-tight"></h2>
                            <p id="knowledgeSubtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
                            <div id="knowledgeBadges" class="flex gap-2 mt-3"></div>
                        </div>
                        <button onclick="Knowledge.clear()" class="text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-colors" aria-label="Close knowledge panel">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6 6 18"/>
                                <path d="M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div id="knowledgeContent" class="px-6 py-4 text-slate-700 dark:text-slate-200 text-sm leading-relaxed"></div>
                    <div id="knowledgeFacts" class="px-6 pb-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Quick Facts</h3>
                        <div id="knowledgeFactsList" class="space-y-2"></div>
                    </div>
                    <div class="px-6 py-3 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
                        <a href="#" id="knowledgeReadMore" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline" target="_blank" rel="noopener noreferrer">
                            Read more on Wikipedia →
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- App script: one IIFE, split into modules -->
    <script>
        (() => {
            'use strict';

            /* ==============================================================
               01 · Config
               ============================================================== */
            const CONFIG = Object.freeze({
                baseUrl: window.location.origin.startsWith('http')
                    ? window.location.origin
                    : 'http://127.0.0.1:8000',
                suggestDebounce: 120,
                maxSuggestions: 8,
                skeletonRows: 4,
                pageWindow: 7,
                pageLead: 3
            });

            /* ==============================================================
               02 · DOM references
               ============================================================== */
            const dom = {
                form: document.getElementById('searchForm'),
                input: document.getElementById('queryInput'),
                clearBtn: document.getElementById('clearBtn'),
                suggestions: document.getElementById('suggestions'),
                results: document.getElementById('resultsContainer'),
                meta: document.getElementById('resultsMeta'),
                pagination: document.getElementById('paginationContainer'),
                themeToggle: document.getElementById('themeToggle'),
                themeColor: document.getElementById('themeColor'),
                aiModePanel: document.getElementById('aiModePanel'),
                aiModeAnswer: document.getElementById('aiModeAnswer'),
                aiModeAnswerBar: document.getElementById('aiModeAnswerBar'),
                aiModeAnswerToggle: document.getElementById('aiModeAnswerToggle'),
                aiModeThinking: document.getElementById('aiModeThinking'),
                aiModeThinkingMarquee: document.getElementById('thinkingMarquee'),
                aiModeToggleText: document.getElementById('aiModeToggleText'),
                aiModeSources: document.getElementById('aiModeSources'),
                aiModeSourcesToggle: document.getElementById('aiModeSourcesToggle'),
                aiModeError: document.getElementById('aiModeError'),
                aiModeQuery: document.getElementById('aiModeQuery'),
                knowledgePanel: document.getElementById('knowledgePanel'),
                knowledgeTitle: document.getElementById('knowledgeTitle'),
                knowledgeSubtitle: document.getElementById('knowledgeSubtitle'),
                knowledgeImage: document.getElementById('knowledgeImage'),
                knowledgeContent: document.getElementById('knowledgeContent'),
                knowledgeBadges: document.getElementById('knowledgeBadges'),
                knowledgeFactsList: document.getElementById('knowledgeFactsList'),
                knowledgeReadMore: document.getElementById('knowledgeReadMore'),
            };

            /* ==============================================================
               03 · App state
               ============================================================== */
            const state = {
                cache: new Map(),       // Instant in-tab results cache.
                query: '',
                page: 1,
                resultCount: 0,
                searchSequence: 0,      // Guards against out-of-order responses.
                searchAbort: null,
                aiMode: {
                    active: false,
                    answer: '',
                    sources: [],
                    loading: false,
                    error: ''
                }
            };

            /* ==============================================================
               04 · Utilities
               ============================================================== */
            const Utils = {
                escapeHtml(value) {
                    return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[character]));
                },

                safeUrl(value) {
                    try {
                        const url = new URL(String(value), window.location.href);
                        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
                    } catch (error) {
                        return '';
                    }
                },

                highlight(text, query) {
                    const source = String(text == null ? '' : text);
                    const terms = Array.from(new Set((String(query).toLowerCase().match(/[\w-]+/g) || [])))
                        .filter(term => term.length > 1)
                        .sort((a, b) => b.length - a.length);

                    if (!terms.length) return Utils.escapeHtml(source);

                    const pattern = new RegExp(
                        '(' + terms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')',
                        'gi'
                    );

                    return source
                        .split(pattern)
                        .map((part, index) => (index % 2 === 1
                            ? '<mark>' + Utils.escapeHtml(part) + '</mark>'
                            : Utils.escapeHtml(part)))
                        .join('');
                },

                engineClass(name) {
                    const value = String(name).toLowerCase();
                    if (value.includes('duck')) return 'eng-ddg';
                    if (value.includes('bing')) return 'eng-bing';
                    if (value.includes('wiki')) return 'eng-wiki';
                    return 'eng-default';
                },

                isTypingTarget(element) {
                    return !!element && (
                        element.tagName === 'INPUT' ||
                        element.tagName === 'TEXTAREA' ||
                        element.isContentEditable
                    );
                }
            };

            /* ==============================================================
               05 · Theme module
               ============================================================== */
            const Theme = {
                media: window.matchMedia('(prefers-color-scheme: dark)'),

                readStored() {
                    try {
                        const value = localStorage.getItem('theme');
                        return (value === 'light' || value === 'dark') ? value : null;
                    } catch (error) {
                        return null;
                    }
                },

                store(theme) {
                    try { localStorage.setItem('theme', theme); } catch (error) { /* ignore */ }
                },

                apply(theme) {
                    const nextTheme = theme === 'dark' ? 'dark' : 'light';
                    document.documentElement.dataset.theme = nextTheme;

                    if (dom.themeColor) {
                        dom.themeColor.setAttribute('content', nextTheme === 'dark' ? '#080d1a' : '#f7f9fd');
                    }

                    if (dom.themeToggle) {
                        const label = nextTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
                        dom.themeToggle.setAttribute('aria-label', label);
                        dom.themeToggle.setAttribute('title', label);
                    }
                },

                toggle() {
                    const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    Theme.apply(nextTheme);
                    Theme.store(nextTheme);
                },

                init() {
                    dom.themeToggle.addEventListener('click', () => Theme.toggle());

                    if (typeof Theme.media.addEventListener === 'function') {
                        Theme.media.addEventListener('change', event => {
                            if (!Theme.readStored()) {
                                Theme.apply(event.matches ? 'dark' : 'light');
                            }
                        });
                    }

                    Theme.apply(
                        document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'
                    );
                }
            };

            /* ==============================================================
               06 · Suggestions module
               ============================================================== */
            const Suggestions = {
                timer: null,
                abortController: null,
                items: [],
                activeIndex: -1,

                hide() {
                    Suggestions.cancel();
                    dom.suggestions.style.display = 'none';
                    dom.input.setAttribute('aria-expanded', 'false');
                    dom.input.removeAttribute('aria-activedescendant');
                    Suggestions.activeIndex = -1;

                    const activeItem = dom.suggestions.querySelector('.suggestion-item.active');
                    if (activeItem) activeItem.classList.remove('active');
                },

                cancel() {
                    if (Suggestions.abortController) {
                        Suggestions.abortController.abort();
                        Suggestions.abortController = null;
                    }
                    clearTimeout(Suggestions.timer);
                    Suggestions.timer = null;
                },

                updateActiveItem() {
                    const items = dom.suggestions.querySelectorAll('.suggestion-item');

                    items.forEach((item, index) => {
                        const selected = index === Suggestions.activeIndex;
                        item.classList.toggle('active', selected);
                        item.setAttribute('aria-selected', selected ? 'true' : 'false');
                    });

                    if (Suggestions.activeIndex >= 0 && items[Suggestions.activeIndex]) {
                        dom.input.setAttribute('aria-activedescendant', items[Suggestions.activeIndex].id);
                        items[Suggestions.activeIndex].scrollIntoView({ block: 'nearest' });
                    } else {
                        dom.input.removeAttribute('aria-activedescendant');
                    }
                },

                choose(index) {
                    const value = Suggestions.items[index];
                    if (!value) return;

                    dom.input.value = value;
                    dom.clearBtn.hidden = false;
                    Suggestions.hide();
                    Search.run(value, 1, true);
                },

                render(list) {
                    Suggestions.items = (Array.isArray(list) ? list : [])
                        .map(suggestion => String(suggestion == null ? '' : suggestion))
                        .filter(Boolean)
                        .slice(0, CONFIG.maxSuggestions);
                    Suggestions.activeIndex = -1;
                    dom.input.removeAttribute('aria-activedescendant');

                    if (!Suggestions.items.length) {
                        Suggestions.hide();
                        return;
                    }

                    dom.suggestions.innerHTML = Suggestions.items.map((suggestion, index) => `
                        <div class="suggestion-item" id="suggestion-${index}" role="option" aria-selected="false">
                            <span class="suggestion-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="7"/>
                                    <path d="m20 20-3.6-3.6"/>
                                </svg>
                            </span>
                            <span class="suggestion-text">${Utils.escapeHtml(suggestion)}</span>
                            <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M7 17 17 7"/>
                                <path d="M8 7h9v9"/>
                            </svg>
                        </div>
                    `).join('');

                    dom.suggestions.querySelectorAll('.suggestion-item').forEach((item, index) => {
                        item.addEventListener('click', () => Suggestions.choose(index));
                    });

                    dom.suggestions.style.display = 'block';
                    dom.input.setAttribute('aria-expanded', 'true');
                },

                async request(query) {
                    if (Suggestions.abortController) Suggestions.abortController.abort();
                    Suggestions.abortController = new AbortController();
                    const controller = Suggestions.abortController;

                    try {
                        const response = await fetch(
                            `${CONFIG.baseUrl}/suggest?q=${encodeURIComponent(query)}`,
                            { signal: controller.signal }
                        );
                        if (!response.ok) throw new Error('Suggestion request failed');

                        const data = await response.json();
                        if (controller.signal.aborted || dom.input.value.trim() !== query) return;

                        Suggestions.render(data && data.suggestions);
                    } catch (error) {
                        if (error.name !== 'AbortError') Suggestions.hide();
                    }
                },

                handleInput() {
                    dom.clearBtn.hidden = !dom.input.value;
                    Suggestions.activeIndex = -1;
                    clearTimeout(Suggestions.timer);

                    const query = dom.input.value.trim();
                    if (!query) {
                        Suggestions.hide();
                        return;
                    }

                    Suggestions.timer = setTimeout(
                        () => Suggestions.request(query),
                        CONFIG.suggestDebounce
                    );
                },

                handleKeydown(event) {
                    if (event.key === 'Escape') {
                        if (dom.suggestions.style.display === 'block') {
                            event.preventDefault();
                            Suggestions.hide();
                        }
                        return;
                    }

                    if (dom.suggestions.style.display !== 'block') return;

                    const items = dom.suggestions.querySelectorAll('.suggestion-item');
                    if (!items.length) return;

                    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                        event.preventDefault();

                        if (Suggestions.activeIndex < 0) {
                            Suggestions.activeIndex = event.key === 'ArrowDown' ? 0 : items.length - 1;
                        } else {
                            const step = event.key === 'ArrowDown' ? 1 : -1;
                            Suggestions.activeIndex =
                                (Suggestions.activeIndex + step + items.length) % items.length;
                        }

                        Suggestions.updateActiveItem();
                    } else if (event.key === 'Enter' && Suggestions.activeIndex >= 0) {
                        event.preventDefault();
                        Suggestions.choose(Suggestions.activeIndex);
                    }
                },

                init() {
                    dom.input.addEventListener('input', () => Suggestions.handleInput());
                    dom.input.addEventListener('keydown', event => Suggestions.handleKeydown(event));

                    document.addEventListener('click', event => {
                        if (!event.target.closest('.search-wrapper')) Suggestions.hide();
                    });

                    dom.clearBtn.addEventListener('click', () => {
                        dom.input.value = '';
                        dom.clearBtn.hidden = true;
                        Suggestions.hide();
                        dom.input.focus();
                    });
                }
            };

            /* ==============================================================
               07 · Renderer module
               ============================================================== */
            const ICONS = Object.freeze({
                searchOff: `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-3.6-3.6"/>
                        <path d="M8.5 11h5"/>
                    </svg>`,
                alert: `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.3 3.6 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/>
                        <path d="M12 9v4"/>
                        <path d="M12 17h.01"/>
                    </svg>`,
                chevronLeft: `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>`,
                chevronRight: `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>`
            });

            const Renderer = {
                meta() {
                    if (!state.query) {
                        dom.meta.innerHTML = '';
                        return;
                    }

                    const countLabel = state.resultCount === 1 ? '1 result' : `${state.resultCount} results`;
                    const summary = state.resultCount
                        ? `Showing <strong>${countLabel}</strong> for <strong>${Utils.escapeHtml(state.query)}</strong>`
                        : `No results for <strong>${Utils.escapeHtml(state.query)}</strong>`;

                    dom.meta.innerHTML = `${summary}<span class="meta-page">Page ${state.page}</span>`;
                },

                skeleton() {
                    state.resultCount = 0;
                    dom.results.setAttribute('aria-busy', 'true');
                    dom.meta.innerHTML = `
                        <span class="meta-loading">
                            <span class="spinner" aria-hidden="true"></span>
                            Searching for <strong>${Utils.escapeHtml(state.query)}</strong>…
                        </span>
                        <span class="meta-page">Page ${state.page}</span>`;

                    dom.results.innerHTML = Array.from({ length: CONFIG.skeletonRows }, () => `
                        <div class="skeleton-card" aria-hidden="true">
                            <div class="skeleton-head">
                                <div class="skeleton sk-fav"></div>
                                <div class="skeleton sk-url"></div>
                            </div>
                            <div class="skeleton sk-title"></div>
                            <div class="skeleton sk-line"></div>
                            <div class="skeleton sk-line short"></div>
                        </div>
                    `).join('');

                    dom.pagination.innerHTML = '';
                },

                card(item, index) {
                    const href = Utils.safeUrl(item.url);
                    let domain = '';
                    let path = '';

                    try {
                        const parsed = new URL(href);
                        domain = parsed.hostname.replace(/^www\./i, '');
                        path = parsed.pathname === '/' ? '' : parsed.pathname + parsed.search;
                        if (path.length > 64) path = path.slice(0, 61) + '…';
                    } catch (error) {
                        domain = String(item.url || '');
                    }

                    if (!domain) domain = 'Source';

                    const title = String(item.title || href || domain);
                    const snippet = item.snippet == null ? '' : String(item.snippet);
                    const engines = Array.from(new Set(
                        (Array.isArray(item.engines) ? item.engines : [])
                            .map(String)
                            .filter(Boolean)
                    ));
                    const tags = engines
                        .map(engine => `<span class="engines-tag ${Utils.engineClass(engine)}">${Utils.escapeHtml(engine)}</span>`)
                        .join('');
                    const favicon = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(domain)}`;

                    return `
                        <article class="result-item" style="--i:${Math.min(index, 8)}">
                            <div class="result-head">
                                <span class="favicon" aria-hidden="true">
                                    <span class="favicon-letter">${Utils.escapeHtml(domain.charAt(0).toUpperCase())}</span>
                                    <img
                                        src="${Utils.escapeHtml(favicon)}"
                                        alt=""
                                        width="16"
                                        height="16"
                                        loading="lazy"
                                        onload="this.style.opacity=1"
                                        onerror="this.remove()"
                                    >
                                </span>
                                <span class="result-source">
                                    <span class="result-domain">${Utils.escapeHtml(domain)}</span>
                                    ${path ? `<span class="result-path">${Utils.escapeHtml(path)}</span>` : ''}
                                </span>
                                ${tags ? `<span class="result-tags">${tags}</span>` : ''}
                            </div>
                            <a class="result-title" href="${Utils.escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${Utils.highlight(title, state.query)}</a>
                            ${snippet ? `<p class="result-snippet">${Utils.highlight(snippet, state.query)}</p>` : ''}
                        </article>`;
                },

                results(results) {
                    const items = (Array.isArray(results) ? results : [])
                        .filter(item => item && typeof item === 'object' && Utils.safeUrl(item.url));

                    state.resultCount = items.length;
                    dom.results.setAttribute('aria-busy', 'false');
                    Renderer.meta();

                    if (!items.length) {
                        dom.results.innerHTML = `
                            <div class="state-card">
                                <div class="state-icon" aria-hidden="true">${ICONS.searchOff}</div>
                                <h2>No results for “${Utils.escapeHtml(state.query)}”</h2>
                                <p>Try a different spelling, a broader phrase, or fewer keywords.</p>
                            </div>`;
                        dom.pagination.innerHTML = '';
                        return;
                    }

                    dom.results.innerHTML = items
                        .map((item, index) => Renderer.card(item, index))
                        .join('');

                    Renderer.pagination();
                },

                pagination() {
                    if (state.page === 1 && state.resultCount === 0) {
                        dom.pagination.innerHTML = '';
                        return;
                    }

                    const start = Math.max(1, state.page - CONFIG.pageLead);
                    const end = start + CONFIG.pageWindow - 1;

                    let html = '<nav class="pagination" aria-label="Search results pages">';
                    html += `
                        <button class="page-btn page-arrow" type="button"
                            data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}
                            aria-label="Previous page">${ICONS.chevronLeft}<span>Previous</span>
                        </button>`;

                    for (let pageNumber = start; pageNumber <= end; pageNumber += 1) {
                        const isCurrent = pageNumber === state.page;
                        html += `
                            <button class="page-btn page-number${isCurrent ? ' active' : ''}" type="button"
                                data-page="${pageNumber}"${isCurrent ? ' aria-current="page"' : ''}
                                aria-label="Page ${pageNumber}">${pageNumber}
                            </button>`;
                    }

                    html += `
                        <button class="page-btn page-arrow" type="button"
                            data-page="${state.page + 1}" ${state.resultCount === 0 ? 'disabled' : ''}
                            aria-label="Next page"><span>Next</span>${ICONS.chevronRight}
                        </button>`;
                    html += '</nav>';

                    dom.pagination.innerHTML = html;

                    dom.pagination.querySelectorAll('[data-page]').forEach(button => {
                        button.addEventListener('click', () => {
                            const page = Number.parseInt(button.dataset.page, 10);
                            if (!Number.isFinite(page) || page < 1 || page === state.page) return;
                            Search.run(state.query, page, true);
                        });
                    });
                },

                error() {
                    state.resultCount = 0;
                    dom.results.setAttribute('aria-busy', 'false');
                    dom.meta.innerHTML = `Search failed for <strong>${Utils.escapeHtml(state.query)}</strong>`;
                    dom.pagination.innerHTML = '';

                    dom.results.innerHTML = `
                        <div class="state-card">
                            <div class="state-icon" aria-hidden="true">${ICONS.alert}</div>
                            <h2>Something went wrong</h2>
                            <p>We couldn't reach the search service. Check your connection and try again.</p>
                            <button class="state-btn" type="button" id="retryBtn">Try again</button>
                        </div>`;

                    const retryBtn = document.getElementById('retryBtn');
                    if (retryBtn) {
                        retryBtn.addEventListener('click', () => Search.run(state.query, state.page, false));
                    }
                },

                clear() {
                    dom.results.innerHTML = '';
                    dom.results.removeAttribute('aria-busy');
                    dom.meta.innerHTML = '';
                    dom.pagination.innerHTML = '';
                }
            };

            /* ==============================================================
               AI Mode module
               ============================================================== */
            const AiMode = {
                escapeHtml(value) {
                    return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[character]));
                },

                linkify(text) {
                    return text.replace(
                        /(https?:\/\/[^\s<]+)/g,
                        (url) => `<a href="${this.escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${this.escapeHtml(url)}</a>`
                    );
                },

                renderMarkdown(text) {
                    let html = text
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/\n/g, '<br>');
                    return '<p>' + html + '</p>';
                },

                renderCitations(text, sources) {
                    let out = text;
                    out = out.replace(
                        /\[(\d+)\]/g,
                        (match, n) => {
                            const idx = Number.parseInt(n, 10);
                            if (Number.isInteger(idx) && idx >= 1 && idx <= sources.length) {
                                return `<a class="ai-mode-cite" href="${this.escapeHtml(sources[idx - 1].url)}" target="_blank" rel="noopener noreferrer" aria-label="Source ${idx}">[${idx}]</a>`;
                            }
                            return match;
                        }
                    );
                    return out;
                },

                toggleCollapse() {
                    const isCollapsed = dom.aiModePanel.classList.contains('collapsed');
                    dom.aiModePanel.classList.toggle('collapsed');
                    dom.aiModeToggleText.textContent = isCollapsed ? 'Hide answer' : 'Show answer';
                },

                showThinking(siteUrls) {
                    dom.aiModePanel.style.display = 'block';
                    dom.aiModePanel.classList.remove('collapsed');
                    dom.aiModeToggleText.textContent = 'Hide answer';
                    dom.aiModeAnswer.style.display = 'none';
                    dom.aiModeAnswer.innerHTML = '';
                    dom.aiModeSources.style.display = 'none';
                    dom.aiModeSources.classList.remove('open');
                    dom.aiModeError.style.display = 'none';

                    const favicons = siteUrls.map(url => {
                        try {
                            const d = new URL(url);
                            return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(d.hostname)}`;
                        } catch (e) { return ''; }
                    }).filter(Boolean);

                    // Duplicate the list so marquee loops seamlessly.
                    const doubled = favicons.length ? [...favicons, ...favicons] : [];
                    const siteHtml = doubled.map(fav => `
                        <div class="thinking-site" title="Reading page…">
                            <img src="${this.escapeHtml(fav)}" alt="" onerror="this.style.display='none'">
                        </div>
                    `).join('');

                    dom.aiModeThinkingMarquee.innerHTML = siteHtml;
                    if (doubled.length) {
                        dom.aiModeThinkingMarquee.classList.remove('paused');
                    } else {
                        dom.aiModeThinkingMarquee.classList.add('paused');
                    }
                    dom.aiModeThinking.style.display = 'flex';
                },

                hideThinking() {
                    dom.aiModeThinking.style.display = 'none';
                    dom.aiModeAnswer.style.display = 'block';
                },

                render(text, sources) {
                    state.aiMode.answer = text;
                    state.aiMode.sources = sources;
                    state.aiMode.loading = false;
                    state.aiMode.error = '';
                    state.aiMode.active = true;

                    this.hideThinking();

                    dom.aiModePanel.style.display = 'block';
                    dom.aiModePanel.classList.remove('collapsed');
                    dom.aiModeToggleText.textContent = 'Hide answer';
                    dom.aiModeError.style.display = 'none';

                    const html = this.renderCitations(this.linkify(this.renderMarkdown(text)), sources);
                    dom.aiModeAnswer.innerHTML = html;

                    // Show/hide answer toggle bar based on content length
                    if (text.length > 200) {
                        dom.aiModeAnswerBar.classList.remove('hidden');
                        dom.aiModeAnswer.classList.remove('expanded');
                        dom.aiModeAnswerToggle.innerHTML = 'Show more <svg class="ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>';
                    } else {
                        dom.aiModeAnswerBar.classList.add('hidden');
                    }

                    this.renderSources(sources);
                    dom.aiModePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                },

                renderSources(sources) {
                    if (!sources || !sources.length) {
                        dom.aiModeSources.innerHTML = '';
                        dom.aiModeSources.classList.remove('open');
                        return;
                    }

                    const rows = sources.map((src, idx) => {
                        const num = idx + 1;
                        let fav = '';
                        try {
                            const d = new URL(src.url);
                            fav = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(d.hostname)}`;
                        } catch (e) { }

                        return `
                            <tr>
                                <td class="ai-source-number-cell">${num}</td>
                                <td class="ai-source-favicon-cell">
                                    <img src="${this.escapeHtml(fav)}" alt="" onerror="this.style.display='none'">
                                </td>
                                <td class="ai-source-content-cell">
                                    <span class="ai-source-title">
                                        <a href="${this.escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer">
                                            ${this.escapeHtml(src.title || src.url)}
                                        </a>
                                    </span>
                                    <span class="ai-source-url">${this.escapeHtml(src.url)}</span>
                                </td>
                            </tr>`;
                    }).join('');

                    dom.aiModeSources.innerHTML = `
                        <h4>Sources <span class="ai-mode-sources-count">(${sources.length})</span></h4>
                        <table class="ai-source-table"><tbody>${rows}</tbody></table>
                    `;
                    dom.aiModeSources.classList.add('open');
                },

                toggleAnswerExpand() {
                    const isExpanded = dom.aiModeAnswer.classList.contains('expanded');
                    dom.aiModeAnswer.classList.toggle('expanded');
                    const btn = dom.aiModeAnswerToggle;
                    if (isExpanded) {
                        btn.innerHTML = '<span>Show more</svg><svg class="ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>';
                    } else {
                        btn.innerHTML = '<span>Show less</svg><svg class="ml-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>';
                    }
                },

                toggleSources(event) {
                    if (event) event.stopPropagation();
                    dom.aiModeSources.classList.toggle('open');
                    const chip = dom.aiModeSourcesToggle;
                    if (chip) chip.classList.toggle('active');
                },

                scrollToSource(num) {
                    const el = document.getElementById(`source-${num}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                },

                showError(message) {
                    state.aiMode.loading = false;
                    state.aiMode.active = false;
                    this.hideThinking();
                    dom.aiModePanel.style.display = 'block';
                    dom.aiModePanel.classList.remove('collapsed');
                    dom.aiModeToggleText.textContent = 'Hide answer';
                    dom.aiModeAnswer.innerHTML = '';
                    dom.aiModeSources.innerHTML = '';
                    dom.aiModeSources.classList.remove('open');
                    dom.aiModeError.textContent = message;
                    dom.aiModeError.style.display = 'block';
                },

                clear() {
                    state.aiMode.active = false;
                    state.aiMode.answer = '';
                    state.aiMode.sources = [];
                    state.aiMode.loading = false;
                    state.aiMode.error = '';
                    dom.aiModePanel.style.display = 'none';
                    dom.aiModePanel.classList.add('collapsed');
                    dom.aiModeToggleText.textContent = 'Show answer';
                    dom.aiModeAnswer.innerHTML = '';
                    dom.aiModeThinking.innerHTML = '';
                    dom.aiModeThinking.style.display = 'none';
                    dom.aiModeSources.innerHTML = '';
                    dom.aiModeSources.classList.remove('open');
                    dom.aiModeError.style.display = 'none';
                    Knowledge.clear();
                },

                async fetchAndRender(query) {
                    this.clear();
                    state.aiMode.loading = true;
                    dom.aiModePanel.style.display = 'block';
                    dom.aiModePanel.classList.remove('collapsed');
                    dom.aiModeToggleText.textContent = 'Hide answer';
                    dom.aiModeQuery.textContent = this.escapeHtml(query);
                    dom.aiModeAnswer.style.display = 'block';
                    dom.aiModeAnswer.innerHTML = '<span class="typing-cursor"></span>';
                    dom.aiModeSources.style.display = 'none';
                    dom.aiModeError.style.display = 'none';

                    // Start thinking with placeholder favicons.
                    this.showThinking([]);

                    try {
                        const response = await fetch(`${CONFIG.baseUrl}/api/ai-answer`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ query })
                        });
                        if (!response.ok || !response.body) {
                            throw new Error(`AI answer request failed (${response.status})`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let sources = [];
                        let answer = '';
                        let displayText = '';
                        let wordIndex = 0;
                        let words = [];
                        let typingTimer = null;
                        let thinkingHidden = false;

                        const flushTyping = () => {
                            if (typingTimer) {
                                clearTimeout(typingTimer);
                                typingTimer = null;
                            }
                        };

                        const typeWriter = (newText) => {
                            flushTyping();
                            // Split new text into words and append to the words array.
                            const newWords = newText.split(/(\s+)/);
                            words = words.concat(newWords);
                            // Reveal words one by one with small delay for typing effect.
                            const revealNext = () => {
                                if (wordIndex < words.length) {
                                    displayText += words[wordIndex];
                                    wordIndex++;
                                    if (!thinkingHidden) {
                                        dom.aiModeThinking.style.display = 'none';
                                        dom.aiModeAnswer.style.display = 'block';
                                        thinkingHidden = true;
                                    }
                                    const html = this.renderCitations(this.linkify(this.renderMarkdown(displayText)), sources) +
                                        '<span class="typing-cursor"></span>';
                                    dom.aiModeAnswer.innerHTML = html;
                                    dom.aiModePanel.scrollTop = dom.aiModePanel.scrollHeight;
                                    typingTimer = setTimeout(revealNext, 30);
                                } else {
                                    // Typing complete for this chunk, remove cursor.
                                    const html = this.renderCitations(this.linkify(this.renderMarkdown(displayText)), sources);
                                    dom.aiModeAnswer.innerHTML = html;
                                    typingTimer = null;
                                }
                            };
                            revealNext();
                        };

                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            let newlineIndex;
                            while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
                                const line = buffer.slice(0, newlineIndex);
                                buffer = buffer.slice(newlineIndex + 1);
                                if (!line.trim()) continue;

                                try {
                                    const parsed = JSON.parse(line);
                                    if (parsed.type === 'text') {
                                        answer += parsed.content;
                                        typeWriter(parsed.content);
                                    } else if (parsed.type === 'sources') {
                                        sources = parsed.sources;
                                    }
                                } catch (error) {
                                    // Ignore malformed lines.
                                }
                            }
                            if (!typingTimer) {
                                dom.aiModePanel.scrollTop = dom.aiModePanel.scrollHeight;
                            }
                        }

                        // Finish any remaining typing.
                        flushTyping();

                        if (buffer.trim()) {
                            try {
                                const parsed = JSON.parse(buffer);
                                if (parsed.type === 'sources') sources = parsed.sources;
                            } catch (error) { /* ignore */ }
                        }

                        // Render final answer with real source favicons for thinking ring.
                        state.aiMode.answer = answer;
                        this.render(answer, sources);
                    } catch (error) {
                        console.error('AI Mode error:', error);
                        this.showError('Could not generate AI answer. Please try again.');
                    } finally {
                        state.aiMode.loading = false;
                    }
                }
            };

            /* ==============================================================
               08 · Search controller
               ============================================================== */
            const Search = {
                setLayout(mode) {
                    document.body.classList.toggle('home-layout', mode === 'home');
                    document.body.classList.toggle('search-layout', mode === 'search');
                },

                async run(query, page, updateUrl) {
                    const normalizedQuery = String(query == null ? '' : query).trim();
                    if (!normalizedQuery) {
                        Knowledge.clear();
                        return;
                    }

                    const safePage = Math.max(1, Number.parseInt(page, 10) || 1);
                    Suggestions.hide();

                    state.query = normalizedQuery;
                    state.page = safePage;

                    if (updateUrl) {
                        try {
                            const url = new URL(window.location.href);
                            url.searchParams.set('q', normalizedQuery);
                            url.searchParams.set('page', String(safePage));
                            window.history.pushState({}, '', url);
                        } catch (error) { /* file:// or restricted history */ }
                    }

                    Search.setLayout('search');
                    window.scrollTo(0, 0);
                    document.title = `${normalizedQuery} — Metasearch`;

                    // 1. Instant cache check.
                    const cacheKey = `${normalizedQuery}:${safePage}`;
                    if (state.cache.has(cacheKey)) {
                        if (state.searchAbort) {
                            state.searchAbort.abort();
                            state.searchAbort = null;
                        }
                        state.searchSequence += 1;
                        Renderer.results(state.cache.get(cacheKey) || []);
                        if (safePage === 1) {
                            AiMode.fetchAndRender(normalizedQuery);
                            Knowledge.fetchAndRender(normalizedQuery);
                        }
                        return;
                    }

                    // 2. Skeleton while the request is in flight.
                    Renderer.skeleton();

                    // 3. Network fetch, aborting any previous request.
                    if (state.searchAbort) state.searchAbort.abort();
                    state.searchAbort = new AbortController();
                    const controller = state.searchAbort;
                    const sequence = ++state.searchSequence;

                    try {
                        const response = await fetch(
                            `${CONFIG.baseUrl}/search?q=${encodeURIComponent(normalizedQuery)}&page=${safePage}`,
                            { signal: controller.signal }
                        );
                        if (!response.ok) throw new Error(`Search request failed (${response.status})`);

                        const data = await response.json();
                        if (sequence !== state.searchSequence || controller.signal.aborted) return;

                        const results = Array.isArray(data.results) ? data.results : [];
                        state.cache.set(cacheKey, results);
                        Renderer.results(results);
                        if (safePage === 1) {
                            AiMode.fetchAndRender(normalizedQuery);
                            if (results.length === 0) {
                                Knowledge.clear();
                            } else {
                                Knowledge.fetchAndRender(normalizedQuery);
                            }
                        }
                    } catch (error) {
                        if (
                            sequence !== state.searchSequence ||
                            error.name === 'AbortError' ||
                            controller.signal.aborted
                        ) return;

                        Renderer.error();
                    } finally {
                        if (state.searchAbort === controller) state.searchAbort = null;
                    }
                },

                showHome() {
                    state.query = '';
                    state.page = 1;
                    state.resultCount = 0;
                    state.searchSequence += 1;

                    if (state.searchAbort) {
                        state.searchAbort.abort();
                        state.searchAbort = null;
                    }

                    Suggestions.hide();
                    Search.setLayout('home');
                    Renderer.clear();
                    AiMode.clear();
                    Knowledge.clear();

                    dom.input.value = '';
                    dom.clearBtn.hidden = true;
                    document.title = 'Metasearch — Search across the web';
                }
            };

            /* ==============================================================
               Knowledge Panel module (Wikipedia)
               ============================================================== */
            const Knowledge = {
                cache: new Map(),

                async fetchAndRender(query) {
                    dom.knowledgePanel.classList.add('hidden');
                    const cacheKey = query.toLowerCase().trim();
                    if (this.cache.has(cacheKey)) {
                        this.render(this.cache.get(cacheKey));
                        return;
                    }

                    try {
                        const data = await this.searchWikipedia(query);
                        if (data && data.title) {
                            // Only show knowledge panel for strong matches
                            // Exact match or query is contained in title or vice versa
                            const q = query.toLowerCase().trim();
                            const t = data.title.toLowerCase().trim();
                            const isExactMatch = q === t;
                            const isQueryInTitle = t.includes(q) && q.length > 2;
                            const isTitleInQuery = q.includes(t) && t.length > 2;

                            if (!isExactMatch && !isQueryInTitle && !isTitleInQuery) {
                                dom.knowledgePanel.classList.add('hidden');
                                return;
                            }

                            this.cache.set(cacheKey, data);
                            this.render(data);
                        } else {
                            dom.knowledgePanel.classList.add('hidden');
                        }
                    } catch (error) {
                        dom.knowledgePanel.classList.add('hidden');
                    }
                },

                async searchWikipedia(query) {
                    // First, search for the page
                    const searchUrl = `${CONFIG.baseUrl}/api/wiki/search?q=${encodeURIComponent(query)}`;
                    const searchResponse = await fetch(searchUrl);
                    if (!searchResponse.ok) return null;
                    const searchData = await searchResponse.json();

                    if (!searchData.results || searchData.results.length === 0) return null;

                    const page = searchData.results[0];
                    const pageTitle = page.title;

                    // Get page details (extract + image)
                    const pageUrl = `${CONFIG.baseUrl}/api/wiki/page?title=${encodeURIComponent(pageTitle)}`;
                    const pageResponse = await fetch(pageUrl);
                    if (!pageResponse.ok) return null;
                    const pageData = await pageResponse.json();

                    return {
                        title: page.title || pageTitle,
                        extract: page.extract || '',
                        image: page.image || '',
                        pageUrl: `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title || pageTitle.replace(/ /g, '_'))}`,
                        ...pageData,
                    };
                },

                render(data) {
                    dom.knowledgeTitle.textContent = data.title || '';
                    dom.knowledgeSubtitle.textContent = data.extract ? data.extract.substring(0, 120) : '';
                    dom.knowledgeReadMore.href = data.pageUrl || '#';

                    if (data.image) {
                        dom.knowledgeImage.src = data.image;
                        dom.knowledgeImage.style.display = 'block';
                    } else {
                        dom.knowledgeImage.style.display = 'none';
                    }

                    dom.knowledgeContent.innerHTML = data.extract ? `<p>${data.extract}</p>` : '';
                    dom.knowledgeFactsList.innerHTML = '';

                    // Build facts table rows from extract
                    const facts = [];
                    if (data.extract) {
                        const sentences = data.extract.split('. ').filter(s => s.trim().length > 0);
                        sentences.slice(0, 5).forEach((s, i) => {
                            facts.push([`Fact ${i + 1}`, s.trim().endsWith('.') ? s.trim() : s.trim() + '.']);
                        });
                    }

                    // Build facts HTML table
                    const factsHtml = facts.map(f => `
                        <tr>
                            <td class="px-4 py-2 border-b border-slate-200 dark:border-slate-700 font-medium text-slate-600 dark:text-slate-300 w-1/4">${f[0]}</td>
                            <td class="px-4 py-2 border-b border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200">${f[1]}</td>
                        </tr>
                    `).join('');

                    dom.knowledgeFactsList.innerHTML = factsHtml;

                    // Add badges
                    dom.knowledgeBadges.innerHTML = `
                        <span class="px-2 py-1 rounded-full text-xs font-medium bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">Wikipedia</span>
                    `;

                    dom.knowledgePanel.classList.remove('hidden');
                },

                clear() {
                    dom.knowledgePanel.classList.add('hidden');
                    dom.knowledgeTitle.textContent = '';
                    dom.knowledgeSubtitle.textContent = '';
                    dom.knowledgeImage.src = '';
                    dom.knowledgeImage.style.display = 'none';
                    dom.knowledgeContent.innerHTML = '';
                    dom.knowledgeBadges.innerHTML = '';
                    dom.knowledgeFactsList.innerHTML = '';
                    dom.knowledgeReadMore.href = '#';
                }
            };

            /* ==============================================================
               09 · App shell: URL state, shortcuts, boot
               ============================================================== */
            const App = {
                readRoute() {
                    const params = new URLSearchParams(window.location.search);
                    return {
                        query: (params.get('q') || '').trim(),
                        page: Math.max(1, Number.parseInt(params.get('page'), 10) || 1)
                    };
                },

                syncFromUrl() {
                    const route = App.readRoute();

                    if (!route.query) {
                        document.title = 'Metasearch — Search across the web';
                        return;
                    }

                    dom.input.value = route.query;
                    dom.clearBtn.hidden = false;
                    Search.run(route.query, route.page, false);
                },

                handlePopState() {
                    const route = App.readRoute();

                    if (!route.query) {
                        Search.showHome();
                        return;
                    }

                    dom.input.value = route.query;
                    dom.clearBtn.hidden = false;
                    Search.run(route.query, route.page, false);
                },

                bindEvents() {
                    dom.form.addEventListener('submit', event => {
                        event.preventDefault();

                        const query = dom.input.value.trim();
                        if (!query) {
                            dom.input.focus();
                            return;
                        }

                        dom.clearBtn.hidden = false;
                        Search.run(query, 1, true);
                    });

                    window.addEventListener('popstate', () => App.handlePopState());

                    document.addEventListener('keydown', event => {
                        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
                            event.preventDefault();
                            dom.input.focus();
                            dom.input.select();
                            return;
                        }

                        if (event.key === '/' && !Utils.isTypingTarget(document.activeElement)) {
                            event.preventDefault();
                            dom.input.focus();
                        }
                    });

                    if (document.readyState === 'loading') {
                        window.addEventListener('DOMContentLoaded', () => App.syncFromUrl());
                    } else {
                        App.syncFromUrl();
                    }
                },

                init() {
                    Theme.init();
                    Suggestions.init();
                    App.bindEvents();
                }
            };

            App.init();
        })();
    </script>
</body>
</html>
