<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metasearch</title>
    <!-- Preconnect speeds up network roundtrips -->
    <link rel="preconnect" href="http://127.0.0.1:8000">

    <style>
        :root {
            --bg: #ffffff;
            --text: #202124;
            --snippet: #4d5156;
            --link: #1a0dab;
            --border: #ebebeb;
            --search-bg: #ffffff;
            --tag-bg: #f1f3f4;
            --tag-text: #5f6368;
            --shadow: rgba(32, 33, 36, 0.16);
            --shimmer: #f0f0f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #202124;
                --text: #e8eaed;
                --snippet: #bdc1c6;
                --link: #8ab4f8;
                --border: #3c4043;
                --search-bg: #303134;
                --tag-bg: #3c4043;
                --tag-text: #bdc1c6;
                --shadow: rgba(0, 0, 0, 0.4);
                --shimmer: #303134;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body.home-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body.search-layout { display: block; padding-top: 20px; }

        .header-container { display: flex; align-items: center; gap: 24px; width: 100%; }
        body.home-layout .header-container {
            flex-direction: column;
            max-width: 600px;
            padding: 20px;
        }
        body.search-layout .header-container {
            flex-direction: row;
            padding: 0 30px 15px 150px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 700;
            color: #4285f4;
            text-decoration: none;
            letter-spacing: -1px;
        }
        body.search-layout .logo { font-size: 1.8rem; }

        .search-wrapper { position: relative; width: 100%; max-width: 650px; }
        .search-box {
            display: flex;
            align-items: center;
            box-shadow: 0 1px 6px var(--shadow);
            border-radius: 24px;
            padding: 11px 20px;
            background: var(--search-bg);
            z-index: 2;
            position: relative;
        }
        .search-box:hover, .search-box:focus-within { box-shadow: 0 2px 8px var(--shadow); }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            margin-left: 10px;
            background: transparent;
            color: var(--text);
        }

        .suggestions {
            display: none;
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            padding-top: 15px;
            background: var(--search-bg);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 6px var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1;
        }

        .suggestion-item {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .suggestion-item:hover, .suggestion-item.active { background: var(--tag-bg); }

        .main-content { display: none; padding: 25px 0 50px 150px; max-width: 800px; }
        body.search-layout .main-content { display: block; }

        .result-item { margin-bottom: 26px; }
        .result-url { font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .result-title { font-size: 20px; color: var(--link); text-decoration: none; line-height: 1.3; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: var(--snippet); line-height: 1.58; margin-top: 4px; }
        .engines-tag {
            font-size: 11px;
            background: var(--tag-bg);
            padding: 2px 7px;
            border-radius: 4px;
            color: var(--tag-text);
            font-weight: bold;
        }

        /* Fast shimmer animation for instant feedback */
        .skeleton {
            background: linear-gradient(90deg, var(--shimmer) 25%, var(--border) 50%, var(--shimmer) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .g-pagination { display: flex; align-items: center; gap: 8px; margin-top: 35px; }
        .g-pagination button {
            color: #4285f4;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 6px 12px;
            font-size: 14px;
        }
        .page-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            color: #4285f4;
            border: none;
            background: transparent;
        }
        .page-number.active { color: #fff; background: #4285f4; }

        @media (max-width: 768px) {
            body.search-layout .header-container { padding: 15px; flex-direction: column; align-items: flex-start; }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body class="home-layout">

    <div class="header-container">
        <a href="/" class="logo">Metasearch</a>
        <div class="search-wrapper">
            <form id="searchForm" class="search-box">
                <span style="color:#9aa0a6">&#128269;</span>
                <input type="text" id="queryInput" placeholder="Search the web..." autocomplete="off" required>
            </form>
            <div id="suggestions" class="suggestions"></div>
        </div>
    </div>

    <div class="main-content">
        <div id="resultsContainer"></div>
        <div id="paginationContainer"></div>
    </div>

    <script>
        const BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8000';
        
        // Browser Instant Cache (0 ms load when revisiting)
        const clientCache = new Map();
        
        const form = document.getElementById("searchForm");
        const input = document.getElementById("queryInput");
        const suggestionsBox = document.getElementById("suggestions");
        const resultsContainer = document.getElementById("resultsContainer");
        const paginationContainer = document.getElementById("paginationContainer");

        let debounceTimer, activeIndex = -1, currentSuggestions = [];
        let suggestAbort = null, searchAbort = null;
        let currentQuery = "", currentPage = 1;

        // Restore state from URL query
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                input.value = q;
                fetchResults(q, parseInt(params.get('page')) || 1, false);
            }
        });

        // Instant Autocomplete with AbortController
        input.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const q = input.value.trim();
            if (!q) { suggestionsBox.style.display = 'none'; return; }

            debounceTimer = setTimeout(async () => {
                if (suggestAbort) suggestAbort.abort(); // Cancel previous unfinished fetch
                suggestAbort = new AbortController();

                try {
                    const res = await fetch(`${BASE}/suggest?q=${encodeURIComponent(q)}`, { signal: suggestAbort.signal });
                    const data = await res.json();
                    renderSuggestions(data.suggestions || []);
                } catch (e) {
                    if (e.name !== 'AbortError') suggestionsBox.style.display = 'none';
                }
            }, 100); // Super-responsive 100ms debounce
        });

        function renderSuggestions(list) {
            currentSuggestions = list;
            if (!list.length) { suggestionsBox.style.display = 'none'; return; }
            suggestionsBox.innerHTML = list.map(s => `
                <div class="suggestion-item">
                    <span style="color:#9aa0a6">&#128269;</span>
                    <span>${s}</span>
                </div>
            `).join('');
            
            document.querySelectorAll('.suggestion-item').forEach((item, index) => {
                item.addEventListener('click', () => {
                    input.value = currentSuggestions[index];
                    suggestionsBox.style.display = 'none';
                    fetchResults(input.value, 1, true);
                });
            });
            suggestionsBox.style.display = 'block';
        }

        // Keyboard arrow navigation for suggestions
        input.addEventListener("keydown", (e) => {
            const items = document.querySelectorAll('.suggestion-item');
            if (!items.length) return;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                activeIndex = (activeIndex + 1) % items.length;
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                activeIndex = (activeIndex - 1 + items.length) % items.length;
            } else if (e.key === "Enter" && activeIndex >= 0) {
                e.preventDefault();
                input.value = currentSuggestions[activeIndex];
                suggestionsBox.style.display = 'none';
                fetchResults(input.value, 1, true);
                return;
            }
            items.forEach((el, idx) => el.classList.toggle('active', idx === activeIndex));
        });

        document.addEventListener("click", e => {
            if (!e.target.closest('.search-wrapper')) suggestionsBox.style.display = 'none';
        });

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (q) fetchResults(q, 1, true);
        });

        // Fetch Search Results (Cached + Abortable)
        async function fetchResults(query, page, updateUrl) {
            suggestionsBox.style.display = 'none';
            currentQuery = query;
            currentPage = page;

            if (updateUrl) {
                const u = new URL(window.location);
                u.searchParams.set('q', query);
                u.searchParams.set('page', page);
                window.history.pushState({}, '', u);
            }

            document.body.className = 'search-layout';
            window.scrollTo(0, 0);

            // 1. Instant Cache Check (Zero Latency!)
            const cacheKey = `${query}:${page}`;
            if (clientCache.has(cacheKey)) {
                renderResults(clientCache.get(cacheKey));
                renderPagination();
                return;
            }

            // 2. Render Fast Skeleton Placeholder
            renderSkeleton();

            // 3. Network Fetch
            if (searchAbort) searchAbort.abort();
            searchAbort = new AbortController();

            try {
                const res = await fetch(`${BASE}/search?q=${encodeURIComponent(query)}&page=${page}`, { signal: searchAbort.signal });
                const data = await res.json();
                const results = data.results || [];
                
                // Store in browser memory
                clientCache.set(cacheKey, results);

                renderResults(results);
                renderPagination();
            } catch (err) {
                if (err.name !== 'AbortError') {
                    resultsContainer.innerHTML = '<p style="color:#e53935; padding:20px 0;">Search failed. Please try again.</p>';
                }
            }
        }

        function renderSkeleton() {
            resultsContainer.innerHTML = [1, 2, 3, 4].map(() => `
                <div style="margin-bottom: 28px;">
                    <div class="skeleton" style="width: 200px; height: 14px;"></div>
                    <div class="skeleton" style="width: 450px; height: 22px;"></div>
                    <div class="skeleton" style="width: 100%; height: 35px;"></div>
                </div>
            `).join('');
            paginationContainer.innerHTML = '';
        }

        function renderResults(results) {
            if (!results.length) {
                resultsContainer.innerHTML = `<p style="padding:20px 0;">No results found.</p>`;
                return;
            }

            resultsContainer.innerHTML = results.map(item => {
                let domain = "";
                try { domain = new URL(item.url).hostname.replace(/^www\./, ''); } catch { domain = item.url; }
                return `
                    <div class="result-item">
                        <div class="result-url">
                            <span>${domain}</span>
                            <span class="engines-tag">${item.engines.join(", ")}</span>
                        </div>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="result-title">${item.title}</a>
                        <div class="result-snippet">${item.snippet}</div>
                    </div>
                `;
            }).join('');
        }

        function renderPagination() {
            let html = '<div class="g-pagination">';
            html += `<button ${currentPage === 1 ? 'disabled style="color:#9aa0a6"' : ''} onclick="fetchResults(currentQuery, ${currentPage - 1}, true)">Previous</button>`;
            
            let start = Math.max(1, currentPage - 3);
            for (let i = start; i < start + 7; i++) {
                html += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="fetchResults(currentQuery, ${i}, true)">${i}</button>`;
            }
            
            html += `<button onclick="fetchResults(currentQuery, ${currentPage + 1}, true)">Next</button></div>`;
            paginationContainer.innerHTML = html;
        }
    </script>
</body>
</html>
