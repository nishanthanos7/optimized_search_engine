<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metasearch — Search across the web</title>
    <meta name="description" content="A fast metasearch engine that searches DuckDuckGo, Bing and Wikipedia at once.">
    <meta name="theme-color" id="themeColor" content="#f7f9fd">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23111111'/%3E%3Ccircle cx='45' cy='45' r='18' fill='none' stroke='white' stroke-width='8'/%3E%3Cpath d='M59 59 L74 74' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="http://127.0.0.1:8000">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // Apply the saved/system theme before first paint to avoid a flash.
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('theme');
                theme = (saved === 'light' || saved === 'dark')
                    ? saved
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (e) { /* storage can be unavailable */ }
            document.documentElement.dataset.theme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#080d1a' : '#f7f9fd');
        })();
    </script>

    <style>
        /* ==================================================================

        /* ---------- 01 · Design tokens (shadcn-inspired B&W) ---------- */
        :root {
            color-scheme: light;
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-2: #f5f5f5;
            --surface-3: #ededed;
            --text: #0f0f0f;
            --text-muted: #71717a;
            --text-faint: #a1a1aa;
            --link: #0f0f0f;
            --border: #d4d4d4;
            --accent: #0f0f0f;
            --accent-2: #71717a;
            --accent-soft: rgba(15, 15, 15, 0.05);
            --ring: rgba(15, 15, 15, 0.10);
            --shadow: rgba(0, 0, 0, 0.05);
            --header-bg: rgba(250, 250, 250, 0.8);
            --skeleton-base: #ededed;
            --skeleton-shine: #f5f5f5;
            --mark-bg: rgba(15, 15, 15, 0.10);
            --danger: #ef4444;
            --logo-a: #0f0f0f;
            --logo-b: #71717a;

            --radius: 0.75rem;
            --radius-sm: 0.5rem;
            --radius-lg: 1rem;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #090909;
            --surface: #18181b;
            --surface-2: #27272a;
            --surface-3: #3f3f46;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --text-faint: #71717a;
            --link: #fafafa;
            --border: #27272a;
            --accent: #fafafa;
            --accent-2: #a1a1aa;
            --accent-soft: rgba(250, 250, 250, 0.05);
            --ring: rgba(250, 250, 255, 0.10);
            --shadow: rgba(0, 0, 0, 0.4);
            --header-bg: rgba(9, 9, 9, 0.8);
            --skeleton-base: #27272a;
            --skeleton-shine: #3f3f46;
            --mark-bg: rgba(250, 250, 250, 0.10);
            --danger: #f87171;
            --logo-a: #fafafa;
            --logo-b: #a1a1aa;

            --radius: 0.75rem;
            --radius-sm: 0.5rem;
            --radius-lg: 1rem;
        }

        /* ---------- 02 · Base & layout ---------- */
        *,
        *::before,
        *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background-color: var(--bg);
            background-image:
                radial-gradient(1100px 560px at 12% -12%, var(--glow-1), transparent 62%),
                radial-gradient(900px 520px at 96% -4%, var(--glow-2), transparent 58%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body.home-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 96px 24px 64px;
        }

        body.search-layout {
            display: block;
            background-image:
                radial-gradient(900px 420px at 8% -18%, var(--glow-1), transparent 60%),
                radial-gradient(760px 400px at 98% -10%, var(--glow-2), transparent 58%);
        }

        ::selection { background: var(--accent); color: #fff; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        [hidden] { display: none !important; }

        /* ---------- 03 · Header shell ---------- */

        .header-container {
            display: flex;
            align-items: center;
            width: 100%;
        }

        body.home-layout .header-container {
            flex-direction: column;
            max-width: 680px;
            padding: 0;
        }

        body.search-layout .header-container {
            position: sticky;
            top: 0;
            z-index: 40;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            padding: 13px 78px 13px clamp(16px, 4vw, 32px);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            backdrop-filter: blur(16px) saturate(150%);
        }

        /* ---------- 04 · Logo ---------- */

        .logo {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 13px;
            color: var(--text);
            text-decoration: none;
            line-height: 1;
        }

        .logo-mark {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 12px 26px -10px rgba(79, 124, 255, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .logo:hover .logo-mark {
            transform: translateY(-1px) rotate(-3deg);
            box-shadow: 0 16px 32px -10px rgba(79, 124, 255, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .logo-mark svg { width: 26px; height: 26px; }

        .logo-text {
            font-size: 2.45rem;
            font-weight: 800;
            letter-spacing: -0.045em;
            background: linear-gradient(120deg, var(--logo-a), var(--logo-b));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--logo-a);
        }

        body.search-layout .logo { gap: 10px; }
        body.search-layout .logo-mark { width: 38px; height: 38px; border-radius: 11px; }
        body.search-layout .logo-mark svg { width: 20px; height: 20px; }
        body.search-layout .logo-text { font-size: 1.3rem; letter-spacing: -0.035em; }

        .home-tagline {
            margin: 16px 0 0;
            font-size: 16px;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: -0.005em;
        }

        body.search-layout .home-tagline,
        body.search-layout .home-hint { display: none; }

        /* ---------- 05 · Search box ---------- */

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 720px;
        }

        body.home-layout .search-wrapper { margin-top: 34px; }

        body.search-layout .search-wrapper {
            flex: 1 1 320px;
            min-width: 0;
            margin: 0;
        }

        .search-box {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 8px 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px -14px var(--shadow), 0 2px 8px -4px var(--shadow);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        body.home-layout .search-box {
            padding: 12px 12px 12px 20px;
            border-radius: 20px;
            box-shadow: 0 22px 50px -24px var(--shadow), 0 4px 14px -8px var(--shadow);
        }

        .search-box:hover {
            border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
        }

        .search-box:focus-within {
            border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
            box-shadow: 0 0 0 4px var(--ring), 0 18px 44px -18px var(--shadow);
        }

        .search-icon {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            color: var(--text-faint);
            transition: color 0.2s ease;
        }

        .search-icon svg { width: 20px; height: 20px; }
        body.home-layout .search-icon svg { width: 21px; height: 21px; }
        .search-box:focus-within .search-icon { color: var(--accent); }

        #queryInput {
            flex: 1 1 auto;
            min-width: 0;
            padding: 6px 0;
            font: inherit;
            font-size: 16px;
            color: var(--text);
            background: transparent;
            border: 0;
            outline: none;
        }

        body.home-layout #queryInput { font-size: 17px; }

        #queryInput::placeholder { color: var(--text-faint); opacity: 1; }

        .clear-btn,
        .submit-btn {
            display: inline-grid;
            flex: 0 0 auto;
            place-items: center;
            padding: 0;
            cursor: pointer;
            border: 0;
            font-family: inherit;
        }

        .clear-btn {
            width: 30px;
            height: 30px;
            color: var(--text-faint);
            background: transparent;
            border-radius: 50%;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .clear-btn:hover { color: var(--text); background: var(--surface-2); }
        .clear-btn svg { width: 16px; height: 16px; }

        .submit-btn {
            width: 40px;
            height: 40px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 12px;
            box-shadow: 0 8px 18px -8px rgba(79, 124, 255, 0.7);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        body.home-layout .submit-btn { width: 46px; height: 46px; border-radius: 14px; }

        .submit-btn:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -8px rgba(79, 124, 255, 0.8);
        }

        .submit-btn:active { transform: scale(0.96); }
        .submit-btn svg { width: 19px; height: 19px; }

        /* ---------- 06 · Suggestions ---------- */

        .suggestions {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 30;
            padding: 6px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 24px 50px -20px var(--shadow), 0 8px 20px -14px var(--shadow);
            animation: dropIn 0.16s ease both;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.active { background: var(--surface-2); }

        .suggestion-icon {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            color: var(--text-faint);
        }

        .suggestion-item.active .suggestion-icon,
        .suggestion-item:hover .suggestion-icon { color: var(--accent); }
        .suggestion-icon svg { width: 16px; height: 16px; }

        .suggestion-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            font-size: 14.5px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .suggestion-arrow {
            flex: 0 0 auto;
            width: 15px;
            height: 15px;
            color: var(--text-faint);
            opacity: 0;
            transform: translate(-3px, 3px);
            transition: opacity 0.12s ease, transform 0.12s ease;
        }

        .suggestion-item:hover .suggestion-arrow,
        .suggestion-item.active .suggestion-arrow {
            opacity: 1;
            transform: none;
        }

        .home-hint {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 22px 0 0;
            font-size: 12.5px;
            color: var(--text-faint);
            text-align: center;
        }

        .home-hint .dot { color: var(--border); }
        .home-hint kbd {
            padding: 1px 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            box-shadow: 0 1px 0 var(--border);
        }

        /* ---------- 07 · Theme toggle ---------- */

        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            color: var(--text-muted);
            cursor: pointer;
            background: var(--header-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 6px 18px -10px var(--shadow);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-toggle:hover {
            color: var(--text);
            transform: translateY(-1px);
            box-shadow: 0 10px 22px -10px var(--shadow);
        }

        .theme-toggle:active { transform: scale(0.96); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* ---------- 08 · Main / results ---------- */

        .main-content {
            display: none;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px clamp(16px, 4vw, 32px) 80px;
        }

        body.search-layout .main-content { display: block; }

        .results-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            margin: 2px 0 16px;
            padding-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            animation: fadeUp 0.3s ease both;
        }

        .results-meta:empty { display: none; }
        .results-meta strong { font-weight: 600; color: var(--text); }
        .meta-page { font-variant-numeric: tabular-nums; }

        .meta-loading {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        /* Results Grid - Two Column Layout with Knowledge Panel */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 32px;
            align-items: start;
        }

        .results-column {
            min-width: 0;
        }

        .knowledge-panel {
            position: sticky;
            top: 24px;
            z-index: 10;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
        }

                .result-item {
            position: relative;
            padding: 24px;
            margin: 0 -24px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            animation: fadeUp 0.3s ease both;
            animation-delay: calc(var(--i, 0) * 20ms);
            transition: all 0.2s ease;
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 24px;
            align-items: start;
            min-height: 150px;
        }

        .result-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(0,0,0,0.12);
        }

        .result-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            min-width: 0;
            margin-bottom: 6px;
            grid-column: 2;
            grid-row: 1;
        }

        .favicon {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--surface-2);
            border: 1px solid var(--border);

            grid-column: 1;
            grid-row: 1 / 3;

        .favicon img {
            width: 100%;
            height: 100%;

        .result-source {

        .result-path {

        .engines-tag {

        }

        }

        }

        }

        :root[data-theme="dark"] .engines-tag.eng-ddg {
            color: #ffb59c;

        .result-title {

        /* ---------- Modern Font ---------- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        /* ---------- AI Mode panel (shadcn + animated borders) ---------- */
        .ai-mode-panel {
            display: none;
            margin: 20px 0 0;
            animation: aiSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        body.search-layout .ai-mode-panel { display: block; }

        /* Collapsed / expanded states */
        .ai-mode-panel.collapsed .ai-mode-answer,
        .ai-mode-panel.collapsed .ai-mode-sources {
            display: none !important;
        }
        .ai-mode-panel.collapsed .ai-mode-thinking { display: none !important; }

        /* Container card with animated border */
        .ai-mode-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 1px 3px 0 var(--shadow), 0 1px 2px -1px var(--shadow);
        }

        .ai-mode-card.border-animate::before {
            border-radius: var(--radius-lg);
        }

        /* Header - clickable to collapse/expand */
        .ai-mode-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;

        /* ---------- Animated borders (colorful shining) ---------- */
        .border-animate {

            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                #ff006e 20%,

                #3a86ff 60%,

            );
            background-size: 300% 300%;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,

            opacity: 0;
            animation: borderShimmer 3s linear infinite;

        .border-animate:hover::before {

        @keyframes borderShimmer {
            0% { transform: translateX(-100%) translateY(-100%); background-position: 0% 0%; }
