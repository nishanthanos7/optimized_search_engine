services:
  search-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
    env_file:
      - .env
    command: ["uvicorn", "src.search_engine.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    init: true
